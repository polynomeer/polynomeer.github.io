<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Polynomeer CMS</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="bar">
  <strong>Polynomeer CMS</strong>
  <span id="who" class="muted"></span>
  <span class="grow"></span>
  <span id="state" class="muted" role="status" aria-live="polite"></span>
</header>

<main id="signin" hidden>
  <p>이 저장소의 관리자만 쓸 수 있습니다.</p>
  <p><a class="button" href="/auth/login">GitHub로 로그인</a></p>
</main>

<main id="app" hidden>
  <section class="pane list">
    <label class="field">
      <span>찾기</span>
      <select id="scope">
        <option value="posts">글</option>
        <option value="topics">토픽</option>
        <option value="series_pages">시리즈</option>
        <option value="content_types">유형</option>
        <option value="post_statuses">상태</option>
      </select>
      <input id="search" type="search" placeholder="제목이나 경로 일부" autocomplete="off">
    </label>
    <p class="muted" id="count"></p>
    <ul id="posts" class="posts"></ul>
    <button id="new" type="button" class="button">새로 만들기</button>
  </section>

  <section class="pane edit">
    <p class="path"><code id="path">선택된 글이 없습니다</code></p>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="write" aria-selected="true">본문</button>
      <button type="button" role="tab" data-tab="meta" aria-selected="false">Front matter</button>
      <button type="button" role="tab" data-tab="images" aria-selected="false">이미지<span id="imagecount"></span></button>
      <button type="button" role="tab" data-tab="history" aria-selected="false">이력</button>
      <button type="button" role="tab" data-tab="preview" aria-selected="false">미리보기</button>
    </div>

    <div data-panel="write">
      <div class="toolbar">
        <button id="cite" type="button" class="button small">인용하기</button>
        <span id="citestatus" class="muted"></span>
      </div>
      <textarea id="body" spellcheck="false" placeholder="마크다운"></textarea>
    </div>

    <div data-panel="meta" hidden>
      <p class="muted">원문을 그대로 고칩니다. 주석과 순서와 모르는 필드는 건드리지 않습니다.</p>
      <textarea id="meta" spellcheck="false" placeholder="title: ..."></textarea>
    </div>

    <div data-panel="images" hidden>
      <div id="drop" class="drop">
        <p>이미지를 끌어다 놓거나 <label class="link" for="pick">고르세요<input id="pick" type="file" accept="image/*" multiple hidden></label>.</p>
        <p class="muted">본문 편집 중에 붙여넣기(<kbd>Cmd/Ctrl</kbd>+<kbd>V</kbd>)해도 됩니다. 글을 저장할 때 같은 커밋으로 올라갑니다.</p>
      </div>
      <p id="imagenote" class="muted"></p>
      <ul id="staged" class="staged"></ul>
    </div>

    <div data-panel="history" hidden>
      <p id="historynote" class="muted"></p>
      <ul id="revisions" class="revisions"></ul>
      <div id="diffbox" hidden>
        <div class="diffhead">
          <strong id="diffwhat"></strong>
          <span id="diffstat" class="muted"></span>
          <span class="grow"></span>
          <button id="restorerev" type="button" class="button">이 버전 불러오기</button>
        </div>
        <div id="diff" class="diff"></div>
      </div>
    </div>

    <div data-panel="preview" hidden>
      <p id="liquid" class="warn" hidden></p>
      <div id="preview" class="preview"></div>
    </div>

    <div class="actions">
      <label class="field inline">
        <input id="pr" type="checkbox" checked>
        <span>PR로 올리기</span>
      </label>
      <button id="save" type="button" class="button primary">저장</button>
      <button id="restore" type="button" class="button" hidden>복구본 불러오기</button>
    </div>
    <p id="result" class="muted"></p>
  </section>
</main>

<dialog id="citedialog" aria-labelledby="citetitle">
  <form id="citeform" method="dialog">
    <h2 id="citetitle">인용하기</h2>

    <label class="field">
      <span>인용문 (마크다운)</span>
      <textarea id="citequote" rows="4" spellcheck="false"></textarea>
    </label>

    <fieldset class="citesource">
      <legend>출처</legend>
      <p id="citechosen" class="chosen muted">아직 고르지 않았습니다</p>
      <label class="field">
        <span>등록된 출처에서 찾기</span>
        <input id="citesearch" type="search" placeholder="제목, 저자, id" autocomplete="off">
      </label>
      <ul id="citesources" class="posts citesources"></ul>

      <details id="citenew">
        <summary>새 출처 등록</summary>
        <div class="field">
          <span>주소 (URL, DOI)</span>
          <div class="row">
            <input id="citeurl" type="url" placeholder="https://..." autocomplete="off">
            <button id="citefetch" type="button" class="button">불러오기</button>
          </div>
        </div>
        <p id="citedraftnote" class="muted"></p>
        <div class="grid2">
          <label class="field"><span>id (글에서 쓰는 값)</span><input id="cnid" autocomplete="off"></label>
          <label class="field"><span>종류</span><select id="cntype"></select></label>
          <label class="field wide"><span>제목</span><input id="cntitle" autocomplete="off"></label>
          <label class="field"><span>저자</span><input id="cnauthor" autocomplete="off"></label>
          <label class="field"><span>발행처</span><input id="cnpublisher" autocomplete="off"></label>
          <label class="field"><span>발행일</span><input id="cnpublished" placeholder="YYYY-MM-DD" autocomplete="off"></label>
          <label class="field"><span>원문 주소</span><input id="cnurl" type="url" autocomplete="off"></label>
        </div>
        <button id="citeusenew" type="button" class="button">이 출처로 정하기</button>
      </details>
    </fieldset>

    <label class="field">
      <span>위치 (쪽, 장, 절, 시간 - 선택)</span>
      <input id="citeat" autocomplete="off">
    </label>
    <label class="field">
      <span>작성자 메모 (선택, 인용문과 따로 표시됩니다)</span>
      <textarea id="citenote" rows="3" spellcheck="false"></textarea>
    </label>

    <p id="citeerror" class="warn" role="alert"></p>
    <div class="actions">
      <button value="cancel" class="button">취소</button>
      <button id="citeinsert" type="button" class="button primary">본문에 넣기</button>
    </div>
  </form>
</dialog>

<script type="module" src="/app.js"></script>
</body>
</html>
