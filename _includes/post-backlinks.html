{% assign backlinks = page.backlinks %}
{% if backlinks.size > 0 %}
  <details id="post-backlinks" class="post-citations">
    <summary>{{ site.data.locales[include.lang].post.backlinks }} <span class="post-tail-meta">({{ backlinks.size }})</span></summary>
    <ul class="post-tail-list list-unstyled">
      {% for cited in backlinks %}
        <li class="post-tail-item">
          <a href="{{ cited.url | relative_url }}" class="post-tail-link">
            <span class="post-tail-title">{{ cited.title }}</span>
            <span class="post-tail-meta">{% include datetime.html date=cited.date lang=include.lang %}</span>
          </a>
        </li>
      {% endfor %}
    </ul>
  </details>
{% endif %}
