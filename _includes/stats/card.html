<!-- One headline figure on /stats/. -->
<article class="stats-card">
  <strong class="stats-card-value">
    {{ include.value }}<small
      {% if include.unit_ko %}data-l10n-ko="{{ include.unit_ko | escape }}" data-l10n-en="{{ include.unit_en | escape }}"{% endif %}
    >{{ include.unit }}</small>
  </strong>
  <span class="stats-card-label"
    {% if include.label_ko %}data-l10n-ko="{{ include.label_ko | escape }}" data-l10n-en="{{ include.label_en | escape }}"{% endif %}
  >{{ include.label }}</span>
</article>
