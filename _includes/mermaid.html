<!-- mermaid-js loader -->
<script type="text/javascript">
  {%- comment -%}
    Mermaid scales every SVG down to the column width. A wide left-to-right
    flowchart ends up with unreadable labels, so past a threshold we keep
    the natural size and let the block scroll sideways like a code block.
  {%- endcomment -%}
  const MERMAID_MIN_SCALE = 0.75;

  function fitMermaid() {
    document.querySelectorAll('.mermaid > svg').forEach((svg) => {
      const container = svg.parentElement;
      const naturalWidth = parseFloat(svg.style.maxWidth);

      if (!naturalWidth || !container.clientWidth) {
        return;
      }

      if (container.clientWidth / naturalWidth < MERMAID_MIN_SCALE) {
        svg.style.maxWidth = 'none';
        svg.style.width = `${naturalWidth}px`;
        container.classList.add('mermaid-scroll');
      }
    });
  }

  function renderMermaid() {
    return mermaid.run({ querySelector: '.mermaid' }).then(fitMermaid);
  }

  function updateMermaid(event) {
    if (event.source === window && event.data && event.data.direction === ModeToggle.ID) {
      const mode = event.data.message;

      if (typeof mermaid === 'undefined') {
        return;
      }

      let expectedTheme = mode === ModeToggle.DARK_MODE ? 'dark' : 'neutral';
      let config = { theme: expectedTheme };

      {%- comment -%}
        Re-render the SVG › <https://github.com/mermaid-js/mermaid/issues/311#issuecomment-332557344>
      {%- endcomment -%}
      const mermaidList = document.getElementsByClassName('mermaid');

      [...mermaidList].forEach((elem) => {
        const svgCode = elem.previousSibling.children.item(0).innerHTML;
        elem.innerHTML = svgCode;
        elem.removeAttribute('data-processed');
        elem.classList.remove('mermaid-scroll');
      });

      mermaid.initialize(config);
      renderMermaid();
    }
  }

  (function () {
    let initTheme = 'neutral';
    const html = document.documentElement;

    if (
      (html.hasAttribute('data-mode') && html.getAttribute('data-mode') === 'dark') ||
      (!html.hasAttribute('data-mode') && window.matchMedia('(prefers-color-scheme: dark)').matches)
    ) {
      initTheme = 'dark';
    }

    let mermaidConf = {
      startOnLoad: false,
      theme: initTheme {%- comment -%}  <default | dark | forest | neutral>; neutral matches the light palette better than default's yellow and lavender {%- endcomment -%}
    };

    {%- comment -%} Create mermaid tag {%- endcomment -%}
    const basicList = document.getElementsByClassName('language-mermaid');
    [...basicList].forEach((elem) => {
      const svgCode = elem.textContent;
      const backup = elem.parentElement;
      backup.classList.add('d-none');
      {%- comment -%} create mermaid node {%- endcomment -%}
      let mermaid = document.createElement('pre');
      mermaid.classList.add('mermaid');
      const text = document.createTextNode(svgCode);
      mermaid.appendChild(text);
      backup.after(mermaid);
    });

    mermaid.initialize(mermaidConf);
    renderMermaid();
    window.addEventListener('message', updateMermaid);
  })();
</script>
