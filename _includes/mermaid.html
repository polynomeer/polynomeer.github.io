<!-- mermaid-js loader -->
<script type="text/javascript">
  {%- comment -%}
    Mermaid scales every SVG down to the column width. A wide left-to-right
    flowchart ends up with unreadable labels, so past a threshold we keep
    the natural size and let the block scroll sideways like a code block.
  {%- endcomment -%}
  const MERMAID_MIN_SCALE = 0.75;

  function fitMermaid() {
    let deferred = false;

    document.querySelectorAll('.mermaid > svg').forEach((svg) => {
      const container = svg.parentElement;
      const naturalWidth = parseFloat(svg.style.maxWidth);

      if (!naturalWidth) {
        return;
      }

      {%- comment -%} A background tab has no layout yet; measure once it is shown. {%- endcomment -%}
      if (!container.clientWidth) {
        deferred = true;
        return;
      }

      if (container.clientWidth / naturalWidth < MERMAID_MIN_SCALE) {
        svg.style.maxWidth = 'none';
        svg.style.width = `${naturalWidth}px`;
        container.classList.add('mermaid-scroll');
      }
    });

    if (deferred) {
      document.addEventListener('visibilitychange', fitMermaid, { once: true });
      window.addEventListener('resize', fitMermaid, { once: true });
    }
  }

  {%- comment -%}
    Mermaid's own "dark" theme is grey and olive and ignores the site's
    Dracula palette. The dark mode uses the "base" theme fed with Dracula
    colours instead; the light mode keeps "neutral".
  {%- endcomment -%}
  const DRACULA = {
    darkMode: true,
    background: '#282a36',
    primaryColor: '#44475a',
    primaryTextColor: '#f8f8f2',
    primaryBorderColor: '#bd93f9',
    secondaryColor: '#343746',
    secondaryTextColor: '#f8f8f2',
    secondaryBorderColor: '#8be9fd',
    tertiaryColor: '#2b2d39',
    tertiaryTextColor: '#f8f8f2',
    tertiaryBorderColor: '#59617c',
    lineColor: '#8e95b1',
    textColor: '#f8f8f2',
    titleColor: '#f8f8f2',
    nodeTextColor: '#f8f8f2',
    clusterBkg: '#2b2d39',
    clusterBorder: '#59617c',
    edgeLabelBackground: '#282a36',
    noteBkgColor: '#44475a',
    noteTextColor: '#f8f8f2',
    noteBorderColor: '#ffb86c',
    actorBkg: '#44475a',
    actorBorder: '#bd93f9',
    actorTextColor: '#f8f8f2',
    actorLineColor: '#8e95b1',
    signalColor: '#f8f8f2',
    signalTextColor: '#f8f8f2',
    labelBoxBkgColor: '#44475a',
    labelBoxBorderColor: '#bd93f9',
    labelTextColor: '#f8f8f2',
    loopTextColor: '#f8f8f2',
    activationBkgColor: '#343746',
    activationBorderColor: '#bd93f9',
    sequenceNumberColor: '#282a36'
  };

  function mermaidTheme(dark) {
    return dark ? { theme: 'base', themeVariables: DRACULA } : { theme: 'neutral' };
  }

  function renderMermaid() {
    return mermaid.run({ querySelector: '.mermaid' }).then(fitMermaid);
  }

  function updateMermaid(event) {
    if (event.source === window && event.data && event.data.direction === ModeToggle.ID) {
      const mode = event.data.message;

      if (typeof mermaid === 'undefined') {
        return;
      }

      let config = mermaidTheme(mode === ModeToggle.DARK_MODE);

      {%- comment -%}
        Re-render the SVG › <https://github.com/mermaid-js/mermaid/issues/311#issuecomment-332557344>
      {%- endcomment -%}
      const mermaidList = document.getElementsByClassName('mermaid');

      [...mermaidList].forEach((elem) => {
        const svgCode = elem.previousSibling.children.item(0).innerHTML;
        elem.innerHTML = svgCode;
        elem.removeAttribute('data-processed');
        elem.classList.remove('mermaid-scroll');
      });

      mermaid.initialize(config);
      renderMermaid();
    }
  }

  (function () {
    const html = document.documentElement;
    const dark =
      (html.hasAttribute('data-mode') && html.getAttribute('data-mode') === 'dark') ||
      (!html.hasAttribute('data-mode') && window.matchMedia('(prefers-color-scheme: dark)').matches);

    {%- comment -%} neutral matches the light palette better than default's yellow and lavender {%- endcomment -%}
    let mermaidConf = { startOnLoad: false, ...mermaidTheme(dark) };

    {%- comment -%} Create mermaid tag {%- endcomment -%}
    const basicList = document.getElementsByClassName('language-mermaid');
    [...basicList].forEach((elem) => {
      const svgCode = elem.textContent;
      const backup = elem.parentElement;
      backup.classList.add('d-none');
      {%- comment -%} create mermaid node {%- endcomment -%}
      let mermaid = document.createElement('pre');
      mermaid.classList.add('mermaid');
      const text = document.createTextNode(svgCode);
      mermaid.appendChild(text);
      backup.after(mermaid);
    });

    mermaid.initialize(mermaidConf);
    renderMermaid();
    window.addEventListener('message', updateMermaid);
  })();
</script>
