<!--
  Jekyll Simple Search loader
  See: <https://github.com/christian-fei/Simple-Jekyll-Search>
-->

{% capture result_elem %}
  <article class="search-result-item px-1 px-sm-2 px-lg-4 px-xl-0">
    <header>
      <h2><a href="{url}">{title}</a></h2>
      <div class="post-meta d-flex flex-column text-muted mt-1 mb-1">
        <div class="search-result-meta">
          {date_label}
          {categories}
          {tags}
        </div>
        <div class="search-result-badges">
          {series_title}
        </div>
      </div>
    </header>
    <p>{snippet}</p>
  </article>
{% endcapture %}

{% capture not_found %}<p class="mt-5">{{ site.data.locales[include.lang].search.no_results }}</p>{% endcapture %}

<script>
  {%- comment -%} Note: dependent library will be loaded in `js-selector.html` {%- endcomment -%}
  const searchInput = document.getElementById('search-input');
  const resultsContainer = document.getElementById('search-results');
  const resultInfo = document.getElementById('search-result-info');
  const hints = document.getElementById('search-hints');
  const hasDisplayValue = (value) => value !== null && value !== undefined && String(value).trim() !== '' && String(value).trim() !== 'null';

  function renderSearchSummary() {
    const query = searchInput.value.trim();

    if (query === '') {
      resultInfo.textContent = '';
      resultInfo.classList.add('d-none');
      return;
    }

    const count = resultsContainer.querySelectorAll('.search-result-item').length;
    resultInfo.textContent =
      count > 0
        ? `{{ site.data.locales[include.lang].search.results }}`
            .replace(':COUNT', count)
            .replace(':QUERY', query)
        : '';

    if (count > 0) {
      resultInfo.classList.remove('d-none');
    } else {
      resultInfo.classList.add('d-none');
    }
  }

  {%- comment -%}
    The index is several hundred KB, so defer fetching it until the visitor
    actually reaches for the search box instead of on every page load.
  {%- endcomment -%}
  let searchIndexRequested = false;

  function initSearch() {
    if (searchIndexRequested) {
      return;
    }

    searchIndexRequested = true;

    fetch('{{ '/assets/js/data/search.json' | relative_url }}')
      .then((response) => response.json())
      .then((index) => {
        const search = SimpleJekyllSearch({
          searchInput: searchInput,
          resultsContainer: resultsContainer,
          json: index,
          searchResultTemplate: '{{ result_elem | strip_newlines }}',
          noResultsText: '{{ not_found }}',
          templateMiddleware: function(prop, value, template) {
            if (prop === 'date_label') {
              return value === '' ? '' : `<div class="search-result-date"><i class="far fa-calendar fa-fw"></i>${value}</div>`;
            }

            if (prop === 'categories') {
              if (value === '') {
                return `${value}`;
              } else {
                return `<div class="search-result-categories"><i class="far fa-folder fa-fw"></i>${value}</div>`;
              }
            }

            if (prop === 'tags') {
              if (value === '') {
                return `${value}`;
              } else {
                return `<div class="search-result-tags"><i class="fa fa-tag fa-fw"></i>${value}</div>`;
              }
            }

            if (prop === 'series_title') {
              return hasDisplayValue(value) ? `<span class="search-chip search-chip-series">${value}</span>` : '';
            }

          }
        });

        // Anything typed while the index was still downloading.
        const pendingQuery = searchInput.value.trim();

        if (pendingQuery !== '') {
          search.search(pendingQuery);
          renderSearchSummary();
        }
      })
      .catch((error) => {
        console.error('search index load error', error);
      });
  }

  ['focus', 'pointerenter', 'touchstart'].forEach((eventName) => {
    searchInput.addEventListener(eventName, initSearch, { once: true, passive: true });
  });

  document.getElementById('search-trigger')?.addEventListener('click', initSearch, { once: true });

  searchInput.addEventListener('input', () => {
    queueMicrotask(() => {
      renderSearchSummary();

      if (searchInput.value.trim() === '') {
        hints.classList.remove('d-none');
      }
    });
  });
</script>
