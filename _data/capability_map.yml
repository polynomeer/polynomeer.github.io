nodes:
  - id: database-internals
    cluster: systems
    x: 20
    y: 58
    icon: fas fa-database
    tone: cyan
    title:
      ko-KR: 데이터베이스 내부 동작
      en: Database Internals
    summary:
      ko-KR: 트랜잭션, MVCC, 락, 리플리케이션을 표면적 사용법이 아니라 시스템 수준의 사고로 설명합니다.
      en: Explains transactions, MVCC, locking, and replication through systems-level reasoning instead of surface usage.
    why_it_matters:
      ko-KR: 저장소의 내부 동작을 이해해야 정합성과 성능 문제를 설계 수준에서 다룰 수 있다는 점을 보여주는 축입니다.
      en: Shows the ability to reason about consistency and performance at the storage layer rather than treating the database as a black box.
    signals:
      - ko-KR: 트랜잭션 정합성과 격리 수준을 실제 설계 판단과 연결합니다.
        en: Connects transactional consistency and isolation levels to practical design choices.
      - ko-KR: 락과 복제처럼 운영 결과에 직접 영향을 주는 내부 메커니즘을 설명합니다.
        en: Explains internals such as locking and replication that directly affect production behavior.
    representative_posts:
      - _posts/notes/database/2025-07-29-mvcc.md
      - _posts/notes/database/2025-07-29-gap-lock.md
      - _posts/notes/database/2025-08-17-db-replication.md

  - id: settlement-consistency
    cluster: systems
    x: 46
    y: 76
    icon: fas fa-lock
    tone: cyan
    title:
      ko-KR: 정산·배치 정합성
      en: Settlement and Batch Consistency
    summary:
      ko-KR: 80만 건 규모의 정산 배치에서 처리 시간과 정합성을 동시에 잡기 위해 청크 분할, 분산락 재설계, 명시적 상태 전이를 적용한 실무 기록입니다.
      en: Production record of applying chunking, distributed lock redesign, and explicit state transitions to an 800k-row settlement batch so runtime and consistency held together.
    why_it_matters:
      ko-KR: 실패하면 정산 일정 전체가 흔들리는 흐름에서, 추측이 아니라 계측과 구조로 문제를 닫아본 경험이 있다는 것을 보여주는 축입니다.
      en: Shows hands-on experience closing problems with measurement and structure in a flow where failure would derail the whole settlement schedule.
    signals:
      - ko-KR: 분산락이 있는데도 레이스가 난 원인을 로그로 추적하고 소유 토큰과 조건부 해제로 재설계했습니다.
        en: Traced a race that happened under a distributed lock and redesigned it with ownership tokens and conditional release.
      - ko-KR: 삭제·등록 배치를 청크와 병렬 처리로 재설계해 2시간을 5분으로 줄였습니다.
        en: Cut a delete-and-reload batch from 2 hours to 5 minutes with chunking and parallel processing.
      - ko-KR: 삭제중, 삭제완료, 등록중, 등록완료 상태를 명시해 운영자의 호출 순서가 아니라 시스템이 정합성을 강제하게 했습니다.
        en: Made the system enforce consistency through explicit states instead of relying on operators calling APIs in order.
    representative_posts:
      - _posts/notes/common/2026-01-03-bulk-insert-with-lock-part4.md
      - _posts/notes/common/2026-09-13-settlement-write-guard.md
      - _posts/notes/common/2026-09-14-batch-heap-dump-to-chunk.md
    supporting_links:
      - title:
          ko-KR: 시리즈 1부부터 읽기
          en: Read the series from part 1
        url: /posts/bulk-insert-with-lock-part1/

  - id: payment-consistency
    cluster: systems
    x: 14
    y: 88
    icon: fas fa-money-bill-transfer
    tone: cyan
    title:
      ko-KR: 결제 정합성 검증
      en: Payment Consistency Verification
    summary:
      ko-KR: 결제·원장 백엔드 ParityPay에서 중복 요청, 동시 차감, 외부 응답 유실, 프로세스 재시작 아래에서 금융 불변조건을 지키는지 26종의 부하·장애 실험으로 검증한 기록입니다.
      en: Verifies with 26 load and failure experiments that a payment and ledger backend keeps its financial invariants under duplicate requests, concurrent debits, lost external responses, and process restarts.
    why_it_matters:
      ko-KR: 실무에서 배운 정합성 원칙을 돈이 걸린 도메인에 한 단계 더 엄밀하게 적용하고, 실험이 찾은 결함과 측정의 실수까지 기록했다는 것을 보여주는 축입니다.
      en: Shows the consistency principles from production work pushed one step further in a money domain, with the defects the experiments found and the measurement mistakes recorded alongside.
    signals:
      - ko-KR: 이중부기 원장의 균형과 불변성을 애플리케이션이 아니라 DB 트리거로 강제했습니다.
        en: Enforces ledger balance and immutability with database triggers rather than application code.
      - ko-KR: 외부 승인 응답 유실을 실패로 확정하지 않고 UNKNOWN 상태로 보존해 조회로 수렴시켰습니다.
        en: Preserves a lost external approval as UNKNOWN and converges it through queries instead of failing it.
      - ko-KR: 잠금 보유 구간을 문장 단위로 측정해 17ms에서 1ms로 줄이고, 설명하지 못한 측정 결과는 그대로 남겼습니다.
        en: Measured lock hold at statement level from 17 ms down to 1 ms and left unexplained measurements on the record.
    representative_posts:
      - _posts/notes/parity-pay/2026-09-14-parity-pay-invariants.md
      - _posts/notes/parity-pay/2026-09-14-parity-pay-lock-hold-time.md
      - _posts/notes/parity-pay/2026-09-14-parity-pay-unknown-state.md
    supporting_links:
      - title:
          ko-KR: 시리즈 전체 보기
          en: Read the whole series
        url: /series/parity-pay/
      - title:
          ko-KR: GitHub 저장소
          en: GitHub repository
        url: https://github.com/polynomeer/parity-pay

  - id: spring-backend
    cluster: application
    x: 38
    y: 24
    icon: fas fa-leaf
    tone: green
    title:
      ko-KR: Spring 백엔드
      en: Spring Backend
    summary:
      ko-KR: Spring과 Spring Boot에서 런타임 라이프사이클, 프레임워크 경계, 실제 백엔드 애플리케이션 동작을 다룹니다.
      en: Covers runtime lifecycle, framework boundaries, and practical backend application behavior in Spring and Spring Boot.
    why_it_matters:
      ko-KR: 프레임워크 사용법을 넘어서, 애플리케이션이 어떻게 시작되고 경계를 나누며 운영되는지 설명하는 역량을 보여줍니다.
      en: Demonstrates an understanding of how applications boot, draw boundaries, and behave in production beyond framework syntax.
    signals:
      - ko-KR: 런타임 라이프사이클과 애노테이션의 실제 의미를 다룹니다.
        en: Explains the practical runtime meaning of lifecycle stages and annotations.
      - ko-KR: 이벤트, 트랜잭션, 구성 경계를 운영 관점으로 연결합니다.
        en: Connects events, transactions, and configuration boundaries to operational concerns.
    representative_posts:
      - _posts/notes/spring/2025-06-30-spring-lifecycle.md
      - _posts/notes/spring/2025-08-07-spring-boot-application-annotation.md
      - _posts/notes/spring/2025-05-13-transactional-event-listener.md

  - id: architecture-judgment
    cluster: judgment
    x: 58
    y: 40
    icon: fas fa-sitemap
    tone: violet
    title:
      ko-KR: 아키텍처와 의사결정
      en: Architecture and Decision Making
    summary:
      ko-KR: 트레이드오프를 명시적으로 드러내고, 설계 선택이 운영 결과와 어떻게 연결되는지 보여줍니다.
      en: Makes tradeoffs explicit and shows how design choices connect to operational outcomes.
    why_it_matters:
      ko-KR: 개별 기술 지식을 실제 구조 선택과 운영 판단으로 이어붙이는 중심 노드입니다.
      en: Acts as the central node that turns isolated technical knowledge into actual structural and operational judgment.
    signals:
      - ko-KR: 설계 선택의 비용과 이익을 동시에 설명합니다.
        en: Explains both the cost and the upside of a design decision.
      - ko-KR: 네트워크, 저장소, 애플리케이션 계층을 하나의 판단 흐름으로 묶습니다.
        en: Connects network, storage, and application layers into one decision narrative.
    representative_posts:
      - _posts/notes/common/2026-09-13-sequence-part3.md
      - _posts/notes/common/2026-09-14-archunit-guardrails-on-legacy.md
      - _posts/notes/common/2026-09-14-polling-to-sqs-pipeline.md
    supporting_links:
      - title:
          ko-KR: 시리즈에서 구조적으로 읽기
          en: Read through connected series
        url: /series/

  - id: hiring-readiness
    cluster: career
    x: 82
    y: 62
    icon: fas fa-user-tie
    tone: amber
    title:
      ko-KR: 채용 및 면접 준비도
      en: Hiring and Interview Readiness
    summary:
      ko-KR: 면접 준비, 질문 분석, 채용 담당자용 자료를 짧은 증거 흐름으로 정리합니다.
      en: Organizes interview preparation, question analysis, and recruiter-facing material into a compact evidence trail.
    why_it_matters:
      ko-KR: 기술 내용을 전달 가능한 형태로 압축하고, 채용 맥락에서 읽히는 구조로 재배치하는 능력을 보여줍니다.
      en: Shows the ability to compress technical material into a readable form and reframe it for hiring contexts.
    signals:
      - ko-KR: 면접 질문을 단순 암기가 아니라 사고 구조로 재구성합니다.
        en: Reframes interview questions as reasoning structures instead of memorization lists.
      - ko-KR: 채용 담당자가 빠르게 판단할 수 있는 읽기 동선을 제공합니다.
        en: Provides a guided reading path for recruiters who need to evaluate quickly.
    representative_posts:
