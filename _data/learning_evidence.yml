        status: completed
        period: "2024"
        summary:
          ko-KR: 41/41강 완강. 네트워크부터 헤더와 캐시까지 10개 섹션을 별도 글로 복습하고, 다이어그램과 독립적인 API 설계 예시를 연결했습니다.
          en: Completed 41/41 lessons; organized ten section-based reviews with diagrams and independent API design examples, from networking to headers and caching.
        source_posts:
          - _posts/lecture/kim-young-han/2026-10-02-inflearn-http-basics-review.md
          - _posts/lecture/http/2026-10-02-http-basics-01-introduction.md
          - _posts/lecture/http/2026-10-02-http-basics-02-network.md
