        summary:
          ko-KR: 65/65강 완강. 객체의 역할과 조립 책임, DI 컨테이너, 생명주기와 스코프를 복습했습니다.
          en: Completed 65/65 lessons; reviewed object composition, dependency injection, lifecycle, and scopes.
        source_posts:
          - _posts/lecture/kim-young-han/2026-10-02-inflearn-spring-core-review.md

