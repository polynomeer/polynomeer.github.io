          - _posts/lecture/http/2026-10-02-http-basics-08-headers.md
          - _posts/lecture/http/2026-10-02-http-basics-09-cache.md
          - _posts/lecture/http/2026-10-02-http-basics-10-next-steps.md
        related_posts:
          - _posts/notes/web/2026-02-13-presigned-url.md
          - _posts/notes/web/2026-02-25-netty.md

