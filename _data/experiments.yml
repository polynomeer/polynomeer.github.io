# /experiments/ 의 데이터. 재현 조건을 만들고, 계측하고, 고친 뒤 같은 조건에서 다시 잰 글만 넣는다.
# 원문 리뷰나 설계 글은 여기 넣지 않는다. 판단 기준은 "같은 조건에서 두 번 쟀는가"다.
# `headline`은 글의 problem_decision_result.result에서 가져온 수치이고, 지어내지 않는다.
enabled: true
intro:
  ko-KR: 재현 조건을 만들고, 무너지는 순간을 계측하고, 고친 뒤 같은 조건에서 다시 잰 기록입니다. 설계 설명이 아니라 표가 결론이고, 각 저장소에 원본 결과와 재실행 명령이 있습니다. 실패한 가설과 측정 도구의 실수도 함께 적습니다.
  en: Records of reproducing a failure, measuring it, fixing it, and measuring again under the same conditions. The conclusion is a table, not an argument; each repository holds the raw output and a command to re-run it. Failed hypotheses and measurement mistakes are recorded too.
labs:
  - id: spring-ops-lab
    name: { ko-KR: spring-ops-lab, en: spring-ops-lab }
    focus: { ko-KR: Spring Boot 서버가 무너지는 방식, en: How a Spring Boot server fails }
    repo: https://github.com/polynomeer/spring-ops-lab
    items:
      - slug: tomcat-thread-exhaustion
        question: { ko-KR: 느린 업스트림 하나가 그것을 호출하지도 않는 엔드포인트를 죽이는가, en: Does one slow upstream kill an endpoint that never calls it }
        headline:
          ko-KR: "`/api/fast` p50 2.9ms → 30초(클라이언트 타임아웃), 실패 66.7%. 요청 스레드 200개 전부가 소켓 읽기에 정지. 조치 후 같은 조건에서 p50 2.9ms·실패 0%"
          en: "`/api/fast` p50 2.9 ms to the 30 s client timeout, 66.7% failed, all 200 request threads parked in a socket read. After the fix, p50 2.9 ms and 0% failures under the same conditions"

  - id: data-ops-lab
    name: { ko-KR: data-ops-lab, en: data-ops-lab }
    focus: { ko-KR: 데이터 계층이 틀리고 느려지는 방식, en: How the data layer gets things wrong and slows down }
    repo: https://github.com/polynomeer/data-ops-lab
    items:
      - slug: isolation-anomalies-experiment
        question: { ko-KR: 어느 이상 현상이 실제로 나고, 엔진은 어떻게 거절하는가, en: Which anomalies actually occur, and how does each engine refuse }
        headline:
          ko-KR: "같은 REPEATABLE READ에서 lost update가 갈렸다. PostgreSQL 20/20 직렬화 실패, MySQL 20/20 조용히 덮어씀. SERIALIZABLE 비용은 22~36ms 대 3,051ms"
          en: "Lost update diverges at the same REPEATABLE READ: PostgreSQL aborts 20/20, MySQL silently overwrites 20/20. SERIALIZABLE costs 22-36 ms against 3,051 ms"
      - slug: cost-of-a-postgres-connection
        question: { ko-KR: 커넥션 풀은 실제로 무엇을 아끼고 언제 키우면 손해인가, en: What does a pool actually save, and when does a bigger one cost }
        headline:
          ko-KR: "커넥션 열기 5.48ms 대 질의 0.23ms, 유휴 커넥션 하나가 1.5MB. 처리량은 풀 10에서 정점이고 150에서 15% 낮은데, 그 구간에서 획득 대기는 89.3 → 38.8ms로 줄고 총 p50은 60.2 → 69.8ms로 늘었다"
          en: "5.48 ms to open a connection against 0.23 ms to run the query, and 1.5 MB per idle connection. Past the peak the acquire wait falls while total latency rises: the queue moved into the server"
      - slug: cache-stampede-experiment
        question: { ko-KR: 캐시가 만료되는 순간 몇 명이 원본까지 가고 방어는 무엇을 대가로 내는가, en: How many clients reach the origin at expiry, and what does each defence cost }
        headline:
          ko-KR: "방어가 없으면 만료마다 200명 중 125.5명이 원본에 도달했다. 락 기반 single flight는 1.5회로 84배 줄이면서 처리량과 p99도 가장 좋았고, XFetch는 beta를 재계산 비용보다 키우면 오히려 나빠졌다"
          en: "Unprotected, 125.5 of 200 clients reach the origin at every expiry. Single flight holds it at 1.5, an 84x reduction, at the best throughput and p99 of any defence"
      - slug: when-the-index-is-not-used
        question: { ko-KR: 옵티마이저가 인덱스를 안 쓰는 것인가 못 쓰는 것인가, en: Is the planner choosing not to use the index, or unable to }
        headline:
          ko-KR: "컬럼에 붙인 암묵적 형변환이 0.07ms를 208.7ms로, 추정은 실제의 417배. 낡은 통계는 31.7배 틀렸는데도 계획이 안 바뀌었다"
          en: "An implicit cast on the column turns 0.07 ms into 208.7 ms with a 417x estimate error. Stale statistics were 31.7x off without changing the plan"

  - id: parity-pay
    name: { ko-KR: ParityPay, en: ParityPay }
    focus: { ko-KR: 장애 아래에서 금융 불변조건이 지켜지는가, en: Do financial invariants hold under failure }
    repo: https://github.com/polynomeer/parity-pay
    items:
      - slug: parity-pay-lock-hold-time
        question: { ko-KR: 같은 지갑 경합의 원인은 어디에 있는가, en: Where does same-wallet contention actually come from }
        headline:
          ko-KR: "잠금 보유 17ms 중 DB 실행은 2.31ms. 순서를 바꿔 1ms로 줄이자 처리량 1.75배, p95 274ms → 144ms"
          en: "Of 17 ms of lock hold, 2.31 ms was database work. Reordering brought it to 1 ms: 1.75x throughput, p95 274 ms to 144 ms"
      - slug: parity-pay-lock-lease
        question: { ko-KR: 락 lease가 트랜잭션보다 먼저 끝나면 정말 정합성이 깨지는가, en: Does consistency really break when the lock lease expires first }
        headline:
          ko-KR: "락은 3회 모두 깨졌다(소유 겹침 1,697~1,714쌍, 초과 승인 340~350건). 락 없는 조건부 UPDATE는 여섯 번 전부 승인 정확히 240·drift 0, 처리량은 2배"
          en: "The lock broke in all three runs (1,697-1,714 overlapping holds, 340-350 over-approvals). The lock-free conditional UPDATE was exact in all six runs at twice the throughput"
      - slug: parity-pay-kafka-failures
        question: { ko-KR: Kafka에서 중복·유실·순서 역전을 직접 만들면 무엇이 막히는가, en: What actually holds when duplicates, loss and reordering are injected }
        headline:
          ko-KR: "유실을 가른 것은 커밋 방식이 아니라 처리와 커밋의 순서였다. `acks=1·0`은 발행 배치 단위로 잃고 `acks=all`은 0건. poison 1건이 파티션을 1.3~1.6초 멈추고 조용히 버려졌다"
          en: "What decided loss was the order of processing and commit, not the commit mode. acks=1 and 0 lose whole publish batches, acks=all loses none"
      - slug: parity-pay-external-isolation
        question: { ko-KR: 느린 외부기관 앞에서 결제 서버를 무엇이 지키는가, en: What protects the payment server from a slow institution }
        headline:
          ko-KR: "플랫폼 스레드 200개는 3회 모두 23.7~24.0초에 고갈. 재시도 3회는 기관 요청을 정확히 3.00배로 만들었고 지터는 봉우리를 낮추지 못했다. 벌크헤드 50은 무관한 API를 p95 10ms로 지켰다"
          en: "200 platform threads exhausted at 23.7-24.0 s in all three runs. Three retries multiplied institution load by exactly 3.00x and jitter did not flatten the peak"
      - slug: parity-pay-experiments-and-defects
        question: { ko-KR: 부하·장애 실험이 문서와 코드가 못 찾은 것을 찾는가, en: Does load and failure testing find what documents and code review miss }
        headline:
          ko-KR: "결함 12건 중 6건은 문서에 '대비되어 있다'고 적혀 있던 것이었고, 1건은 테스트가 있었는데 통과했다"
          en: "Of 12 defects, 6 were written up in the design as already handled, and one had a test that passed"

  - id: monticker
    name: { ko-KR: monticker, en: monticker }
    focus: { ko-KR: 실시간 시세 파이프라인의 순서와 지연, en: Ordering and latency in a real-time market data pipeline }
    repo: https://github.com/polynomeer/monticker
    items:
      - slug: monticker-ws-vs-polling
        question: { ko-KR: WebSocket과 폴링은 클라이언트 1만에서 무엇이 갈리는가, en: What separates WebSocket from polling at ten thousand clients }
        headline:
          ko-KR: "WebSocket은 폴링의 CPU 1/10~1/20. 폴링은 5,300 req/s에서 천장을 쳐 요청의 95%를 버렸다. 느린 연결 25개가 모든 클라이언트를 p99 19초 멈췄고 발행 스레드 풀을 늘려 196ms로"
          en: "WebSocket uses a tenth to a twentieth of polling's CPU. Polling hit a ceiling at 5,300 req/s and dropped 95% of requests"
      - slug: monticker-partition-ordering
        question: { ko-KR: 키가 같은데도 순서가 깨지는 이유는 무엇인가, en: Why does ordering break even when the key is the same }
        headline:
          ko-KR: "27회 중 9회에서 순서가 깨졌고 원인은 게이트웨이의 `acks=0`이었다. 고치자 45회 위반 0. 핫 종목이 스레드의 90%를 먹으면 같은 파티션 종목이 p99 13초로 함께 밀린다"
          en: "Ordering broke in 9 of 27 runs; the cause was acks=0 in the gateway. After the fix, 0 violations in 45 runs"
