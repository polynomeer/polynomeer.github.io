# The layout text of site

# ----- Commons label -----

layout:
  post: Post
  category: Category
  tag: Tag
  roadmap: Roadmap
  topic-hub: Topic Hub

# The tabs of sidebar
tabs:
  # format: <filename_without_extension>: <value>
  home: Home
  topics: Topics
  categories: Categories
  tags: Tags
  archives: Archives
  roadmaps: Roadmaps
  about: About

# the text displayed in the search bar & search results
search:
  hint: search
  cancel: Cancel
  no_results: Oops! No results found.
  results: ":COUNT results for \":QUERY\""

panel:
  lastmod: Recently Updated
  trending_tags: Trending Tags
  toc: Contents

copyright:
  # Shown at the bottom of the post
  license:
    template: This post is licensed under :LICENSE_NAME by the author.
    name: CC BY 4.0
    link: https://creativecommons.org/licenses/by/4.0/

  # Displayed in the footer
  brief: Some rights reserved.
  verbose: >-
    Except where otherwise noted, the blog posts on this site are licensed
    under the Creative Commons Attribution 4.0 International (CC BY 4.0) License by the author.

meta: Using the :THEME theme for :PLATFORM.

not_found:
  statement: Sorry, we've misplaced that URL or it's pointing to something that doesn't exist.

notification:
  update_found: A new version of content is available.
  update: Update

# ----- Posts related labels -----

post:
  written_by: By
  posted: Posted
  updated: Updated
  words: words
  pageview_measure: views
  series: Series
  series_progress: "Part :CURRENT of :TOTAL"
  series_previous: Previous in series
  series_next: Next in series
  roadmaps: Roadmaps
  roadmaps_title: Continue in a roadmap
  roadmap_stage: "Stage: :STAGE"
  recommendation_series: Same series
  recommendation_roadmap: Same roadmap
  recommendation_topic: Same topic
  read_time:
    unit: min
    prompt: read
  relate_posts: Further Reading
  share: Share
  button:
    next: Newer
    previous: Older
    copy_code:
      succeed: Copied!
    share_link:
      title: Copy link
      succeed: Link copied successfully!

# Date time format.
# See: <http://strftime.net/>, <https://day.js.org/docs/en/display/format>
df:
  post:
    strftime: "%b %e, %Y"
    dayjs: "ll"
  archives:
    strftime: "%b"
    dayjs: "MMM"

# categories page
categories:
  category_measure:
    singular: category
    plural: categories
  post_measure:
    singular: post
    plural: posts

roadmaps:
  eyebrow: Learning path
  directory_title: Explore roadmap-based reading paths
  directory_description: Follow curated sequences of posts instead of browsing only by time, category, or tag.
  post_count: ":COUNT posts"
  standalone_title: Supporting articles

topics:
  eyebrow: Curated topic hub
  directory_title: Start from topic-first entry pages
  directory_description: Explore curated topic landing pages that combine featured reads, related series, roadmaps, and supporting posts.
  post_count: ":COUNT posts"
  featured_posts: Start here
  featured_roadmaps: Related roadmaps
  featured_series: Key series
  additional_posts: Additional reading

home:
  curation_explore: Explore
  curation_topics_eyebrow: Curated topics
  curation_topics_title: Start with strong subject entry points
  curation_roadmaps_eyebrow: Structured learning
  curation_roadmaps_title: Follow roadmap-based reading paths
  curation_series_eyebrow: Ordered series
  curation_series_title: Read through connected series
  curation_series_count: ":COUNT posts"
  curation_series_fallback: A connected sequence of posts designed to be read in order.
