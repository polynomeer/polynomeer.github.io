about:
  motto: Make Non Polynomial Polynomial
  intro_title: Turning complex problems into explicit structures
  intro_summary_1: I am a backend engineer who has designed and implemented service flows that remain operable under real-world complexity. I have spent most of my time on systems where state transitions, concurrency, and transactional consistency matter, and I focus on building platforms that remain reliable across change and failure conditions.
  intro_summary_2: In large-scale data processing environments, I analyze bottlenecks with measurement-first methods and improve both code and data structures to raise performance and stability continuously. Payment and settlement flows, where failure is unacceptable, are the kind of systems I care about most.
  intro_summary_3: This blog records the engineering judgment and experiments that came out of that work. I write mostly about database internals, Spring backend behavior, architectural decisions, performance improvement, concurrency control, and operating batch or settlement systems with higher reliability.
  capabilities_eyebrow: Capabilities
  capabilities_note: Each axis opens the matching entry in the capability map, where the reasoning and the evidence behind it are written out.
  questions_eyebrow: Measured
  questions_more: See every measured record
