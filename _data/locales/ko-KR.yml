about:
  motto: Make Non Polynomial Polynomial
  intro_title: 복잡한 문제를 명확한 구조로 풀어냅니다
  intro_summary_1: 복잡한 서비스 흐름을 안정적으로 운영 가능한 구조로 설계하고 구현해 온 백엔드 엔지니어입니다. 특히 상태 전이와 동시성, 트랜잭션 정합성이 중요한 시스템을 다루며, 다양한 예외 상황과 변화 속에서도 신뢰할 수 있게 동작하는 플랫폼을 만드는 데 집중해 왔습니다.
  intro_summary_2: 대규모 데이터 처리 환경에서는 병목을 계측 기반으로 분석하고, 코드와 데이터 구조를 함께 개선하며 성능과 안정성을 지속적으로 높여 왔습니다. 결제나 정산처럼 실패하면 안 되는 흐름을 더 정확하고 견고하게 만들고, 사용자와 서비스가 모두 신뢰할 수 있는 시스템을 만드는 것이 제가 가장 오래 붙들고 있는 주제입니다.
  intro_summary_3: 이 블로그에는 그 과정에서 얻은 실무적 판단과 실험 결과를 남깁니다. 데이터베이스 내부 동작, Spring 백엔드, 아키텍처 의사결정, 성능 개선, 동시성 제어, 배치 및 정산 시스템 운영처럼 실제 시스템을 더 정확하고 견고하게 만드는 데 필요한 주제를 주로 다룹니다.
