# About 히어로 아래에 붙는 것들. 경력 연표는 여기 없습니다 - /resume/ 가 그 일을 합니다.
#
# 히어로의 eyebrow·제목·요약은 _data/recruit_mode.yml 의 hero 를 그대로 씁니다. 같은 문장을 두
# 군데 적으면 한쪽만 고쳐집니다.
enabled: true

# 상단 터미널 타이핑. GitHub 프로필 README 의 readme-typing-svg 와 같은 내용입니다.
#
# 원격 이미지를 그대로 걸지 않은 이유: 외부 서비스가 죽으면 소개 페이지 첫 화면이 비고, 이미지라
# 텍스트가 선택·검색되지 않으며, 지정된 초록(#7EE787)이 라이트 테마에서 대비가 모자랍니다. 같은
# 문구를 같은 리듬으로 CSS 로 그립니다.
terminal:
  # duration 2800ms + pause 1200ms = 줄당 4초, 6줄이니 한 바퀴 24초입니다.
  lines:
    - { text: "$ whoami", prompt: true }
    - { text: "polynomeer — backend engineer" }
    - { text: "$ cat motto.txt", prompt: true }
    - { text: "Make Non-Polynomial Polynomial." }
    - { text: "$ echo $INTERESTS", prompt: true }
    - { text: "concurrency, Redis internals, someday my own product" }

# 구직 여부. 검토자가 가장 먼저 확인하는 한 줄입니다.
status:
  ko-KR: 백엔드 엔지니어 포지션을 찾고 있습니다
  en: Open to backend engineering roles

# 숫자는 적지 않습니다. 사이트 데이터에서 세어 옵니다(about-intro.html) - 손으로 적으면
# 글이 늘어나도 그대로 남아 있다가 어느 날 거짓말이 됩니다.
stats:
  - key: experiments
    url: /experiments/
    label:
      ko-KR: 실측 기록
      en: measured experiments
  - key: posts
    url: /archives/
    label:
      ko-KR: 글
      en: posts
  - key: labs
    url: /experiments/
    label:
      ko-KR: 공개 저장소
      en: public repositories

contact:
  email: polynomeer@gmail.com
  github: https://github.com/polynomeer
  linkedin: https://www.linkedin.com/in/polynomeer
