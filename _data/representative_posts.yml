enabled: true
description:
  ko-KR: 실무에서 병목과 정합성 문제를 어떻게 추적하고 구조로 해결했는지 가장 잘 보여주는 글 모음입니다.
  en: Posts that best show how production bottlenecks and consistency problems were traced and solved structurally.

items:
  - path: _posts/notes/parity-pay/2026-09-14-parity-pay-lock-hold-time.md
    summary:
      ko-KR: 동일 지갑 경합의 원인을 추론에서 측정으로 바꾸고, 잠금을 필요 이상으로 오래 쥐던 결함과 측정 방법의 실수까지 기록한 글입니다.
      en: Turns a same-wallet contention diagnosis from inference into measurement, and records the excess lock hold defect along with the measurement mistakes made on the way.
    capability:
      ko-KR: 계측 기반 원인 추적
      en: Measurement-driven root cause analysis
    surfaces: [recruit, panel]
  - path: _posts/notes/common/2026-01-03-bulk-insert-with-lock-part4.md
    summary:
      ko-KR: 분산락이 있는데도 레이스가 발생한 원인을 로그로 추적하고, 락 소유권과 해제 조건이 왜 필요한지 보여줍니다.
      en: Traces why a race still happened under a distributed lock and shows why lock ownership and release conditions matter.
    capability:
      ko-KR: 동시성과 락
      en: Concurrency and locking
    surfaces: [recruit, panel]
  - path: _posts/notes/common/2026-09-13-settlement-write-guard.md
    summary:
      ko-KR: 정산이 도는 동안 기준 데이터 수정을 막기 위해 물리 락 대신 상태 플래그와 AOP를 택한 이유와, 남긴 경합 창을 어디까지 받아들였는지 설명합니다.
      en: Explains why a state flag with AOP replaced a physical lock to block edits during settlement, and how much of the remaining race window was accepted and why.
    capability:
      ko-KR: 정합성과 상태 전이 설계
      en: Consistency and state transition design
    surfaces: [recruit, panel]
  - path: _posts/notes/common/2026-09-13-sequence-part3.md
    summary:
      ko-KR: 시퀀스 채번을 INSERT 시점으로 옮기고 범위 단위로 받아 계약 생성 시간을 2분에서 10초로 줄인 구조 변경과, 결번을 허용한 판단을 다룹니다.
      en: Covers moving sequence allocation to INSERT time with range allocation, cutting contract creation from 2 minutes to 10 seconds, and the decision to accept gaps.
    capability:
      ko-KR: 계측 기반 레거시 재설계
      en: Measurement-driven legacy redesign
    surfaces: [recruit, panel]
  - path: _posts/notes/common/2026-09-14-batch-heap-dump-to-chunk.md
    summary:
      ko-KR: Heap Dump가 가리킨 영속성 컨텍스트 누적을 Tasklet에서 Chunk로, XSSF에서 SXSSF로 바꿔 해결한 기록입니다.
      en: Follows a heap dump to persistence context accumulation and resolves it by moving from Tasklet to Chunk and from XSSF to SXSSF.
    capability:
      ko-KR: 대량 배치 성능
      en: Large-scale batch performance
    surfaces: [recruit]
  - path: _posts/notes/parity-pay/2026-09-14-parity-pay-unknown-state.md
    summary:
      ko-KR: 외부 승인 응답이 유실됐을 때 타임아웃을 실패로 확정하지 않고 UNKNOWN 상태로 보존해 조회로 수렴시키는 설계와, 실험이 드러낸 문서에 없던 경로를 다룹니다.
      en: Preserves a lost external approval as UNKNOWN instead of failing it, converges through queries, and documents the paths the experiments found missing from the design.
    capability:
      ko-KR: 결제 정합성
      en: Payment consistency
    surfaces: [recruit]
