enabled: true
description:
  ko-KR: 실무에서 병목과 정합성 문제를 어떻게 추적하고 구조로 해결했는지 가장 잘 보여주는 글 모음입니다.
  en: Posts that best show how production bottlenecks and consistency problems were traced and solved structurally.

items:
  - path: _posts/notes/common/2026-01-03-bulk-insert-with-lock-part4.md
    summary:
      ko-KR: 분산락이 있는데도 레이스가 발생한 원인을 로그로 추적하고, 락 소유권과 해제 조건이 왜 필요한지 보여줍니다.
      en: Traces why a race still happened under a distributed lock and shows why lock ownership and release conditions matter.
    capability:
      ko-KR: 동시성과 락
      en: Concurrency and locking
    surfaces: [recruit, panel]
  - path: _posts/notes/common/2026-01-03-bulk-insert-with-lock-part3.md
    summary:
      ko-KR: 80만 건 삭제·등록 배치를 청크 분할과 병렬 처리로 재설계해 2시간을 5분으로 줄인 과정을 설명합니다.
      en: Walks through redesigning an 800k-row delete-and-reload batch with chunking and parallelism, from 2 hours to 5 minutes.
    capability:
      ko-KR: 대량 배치 성능
      en: Large-scale batch performance
    surfaces: [recruit, panel]
  - path: _posts/notes/common/2026-03-20-architectural-decisions.md
    summary:
      ko-KR: 느린 INSERT의 원인이 SELECT 안에서 일어나던 시퀀스 UPDATE였음을 밝히고, 계측으로 병목을 특정하는 과정을 보여줍니다.
      en: Shows that a slow INSERT was really a sequence UPDATE inside a SELECT, and how measurement pinned the bottleneck down.
    capability:
      ko-KR: 계측 기반 원인 추적
      en: Measurement-driven root cause analysis
    surfaces: [recruit, panel]
  - path: _posts/notes/common/2025-05-22-legacy-jsp-system-refactoring-3.md
    summary:
      ko-KR: MyBatis 변경과 JPA/QueryDSL 조회가 공존하는 환경에서 데이터 정합성을 어떻게 지켰는지 설명합니다.
      en: Explains how data consistency was kept while MyBatis writes and JPA/QueryDSL reads coexisted during a legacy migration.
    capability:
      ko-KR: 레거시 재설계와 정합성
      en: Legacy redesign and consistency
    surfaces: [recruit, panel]
