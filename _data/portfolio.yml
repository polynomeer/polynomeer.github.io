career:
  note:
    ko-KR: (주)드림어스컴퍼니(FLO) 재직 중(2021.12 – 2025.2) 수행한 프로젝트입니다. 각 항목의 상세 과정은 연결된 글에서 다룹니다.
    en: Projects delivered at Dreamus Company (FLO), 2021.12 – 2025.2. Each entry links to the posts that walk through the work in detail.
  items:
    - id: mcp-revamp
      title:
        ko-KR: 음원 콘텐츠 플랫폼(MCP) 전면 개편
        en: Music Contents Platform (MCP) redesign
      period: 2024.1 – 2024.11
      role:
        ko-KR: 백엔드 리딩(3인 팀) — 배포 전략·도메인 규칙 설계 및 공유, 공통 기능·ArchUnit 아키텍처 규칙·핵심 도메인 API 개발
        en: Backend lead (team of 3) — designed and shared deployment strategy and domain rules; built shared features, ArchUnit architecture rules, and core domain APIs
      summary:
        ko-KR: 복잡한 상태 전이와 검증 규칙을 가진 콘텐츠 플랫폼을 도메인 중심 아키텍처로 재설계해 성능, 정합성, 확장성을 개선했습니다.
        en: Redesigned a content platform with complex state transitions and validation rules around a domain-centric architecture, improving performance, consistency, and extensibility.
      detail:
        ko-KR: 화면 단위로 흩어진 API를 도메인 책임 기반으로 재설계해 응답 시간을 1.5초에서 300ms로 단축했습니다. 시퀀스 채번 구조를 바꿔 동시 요청 시 계약 생성 대기 시간을 2분에서 10초로 줄였고, 직접 설계한 ArchUnit 규칙과 SonarCloud 게이트로 정적 분석 위반을 480건에서 75건으로 줄였습니다.
        en: Rebuilt screen-driven APIs around domain responsibilities, cutting response time from 1.5 s to 300 ms. Restructured sequence allocation to bring contract creation under concurrent load from 2 minutes to 10 seconds, and reduced static analysis violations from 480 to 75 with ArchUnit rules and SonarCloud gates I designed.
      metrics:
        - label: { ko-KR: API 응답, en: API response }
          from: 1.5초
          to: 300ms
        - label: { ko-KR: 계약 생성, en: Contract creation }
          from: 2분
          to: 10초
        - label: { ko-KR: 정적 분석 위반, en: Static analysis violations }
          from: 480건
          to: 75건
      tech: [Java, Spring Boot, JPA, QueryDSL, MyBatis, MapStruct, MySQL, RabbitMQ, ArchUnit]
      posts:
        - /posts/sequence-part3/
        - /posts/shadow-release-query-migration/
        - /posts/archunit-guardrails-on-legacy/

    - id: equity-system
      title:
        ko-KR: 지분율 시스템 트랜잭션 안정성 및 동시성 개선
        en: Equity share system — transaction stability and concurrency
      period: 2022.8 – 2022.11
      role:
        ko-KR: 단독 설계 및 구현
        en: Sole designer and implementer
      summary:
        ko-KR: 저작권·실연권 지분율을 대량으로 처리하는 정산 시스템에서 동시성 문제와 배치 병목을 개선해 데이터 정합성과 처리 성능을 높였습니다.
        en: Fixed concurrency problems and batch bottlenecks in a settlement system that processes copyright and performance-right shares in bulk, improving both consistency and throughput.
      detail:
        ko-KR: 인덱스 재설계와 청크 기반 트랜잭션 전환으로 80만 건 이상의 대량 삭제 처리 시간을 2시간에서 5분으로 단축했습니다. Redis 분산락을 SETNX와 Lock Token 기반으로 재설계하고 삭제중, 삭제완료, 등록중, 등록완료 상태 전이 모델을 도입해 Race Condition을 제거했으며, 병렬 파이프라인으로 대량 등록 시간을 40분에서 12분으로 줄였습니다.
        en: Index redesign and chunked transactions cut a bulk delete of over 800k rows from 2 hours to 5 minutes. Redesigned the Redis lock around SETNX with an ownership token, introduced an explicit state transition model, and removed the race condition; a parallel pipeline brought bulk registration from 40 to 12 minutes.
      metrics:
        - label: { ko-KR: 대량 삭제, en: Bulk delete }
          from: 2시간
          to: 5분
        - label: { ko-KR: 대량 등록, en: Bulk registration }
          from: 40분
          to: 12분
      tech: [Java, Spring Boot, Redis, MySQL, AWS]
      posts:
        - /posts/bulk-insert-with-lock-part4/
        - /posts/bulk-insert-with-lock-part3/
        - /series/batch-structure-improvement/

    - id: mds
      title:
        ko-KR: 글로벌 유통 시스템(MDS) 구축
        en: Global Music Distribution System (MDS)
      period: 2023.1 – 2024.1
      role:
        ko-KR: 시니어 개발자가 설계한 ArchUnit 기반 공통 인터페이스 계약에 따라 콘텐츠·라이선스 관리 API 개발, 이후 계약 관리까지 인수인계받아 정담당자로 유지보수
        en: Built content and license management APIs on the ArchUnit-enforced interface contract designed by a senior engineer; later took over contract management as the owning maintainer
      summary:
        ko-KR: 글로벌 파트너사가 앨범을 등록하고 관리자가 검수하는 음원 유통 시스템을 구축하고, DDEX 기반 자동 전송으로 해외 플랫폼과의 직접 유통·정산 구조를 지원했습니다.
        en: Built a distribution system where global partners register albums and administrators review them, with DDEX-based automated delivery supporting direct distribution and settlement with overseas platforms.
      detail:
        ko-KR: 정산 대상 단위에 상태 플래그 기반 경량 락을 설계해 정산 중 메타데이터 변경을 사전 차단했습니다. 폴링 기반 배치를 Amazon SQS 이벤트 파이프라인으로 전환해 평균 처리 대기 시간을 3~5분에서 1분 내외로 줄였습니다.
        en: Designed a state-flag lightweight lock per settlement target to block metadata edits during settlement runs. Replaced a polling batch with an Amazon SQS event pipeline, bringing average wait from 3–5 minutes to about 1 minute.
      metrics:
        - label: { ko-KR: 처리 대기, en: Processing wait }
          from: 3~5분
          to: 1분 내외
      tech: [Java, Spring Boot, JPA, Spring Batch, MySQL, Amazon SQS, ArchUnit]
      posts:
        - /posts/settlement-write-guard/
        - /posts/polling-to-sqs-pipeline/

    - id: batch-excel
      title:
        ko-KR: 대용량 배치·Excel 처리 최적화
        en: Large-scale batch and Excel processing
      period: 2022.9 – 2022.12
      role:
        ko-KR: 단독 수행
        en: Sole implementer
      summary:
        ko-KR: 대용량 Excel과 배치 처리에서 반복되던 메모리 급증과 장기 트랜잭션 문제를 청크 기반 배치와 스트리밍 구조로 개선해 OOM을 제거했습니다.
        en: Removed recurring OOM and long-transaction problems in large batch and Excel workloads by moving to chunked batches and streaming generation.
      detail:
        ko-KR: Heap Dump, GC 로그, Thread Dump 분석으로 원인이 영속성 컨텍스트 누적임을 확인한 뒤 배치를 청크 기반 트랜잭션으로 전환해 메모리 피크를 3.8GB에서 1.6GB로 줄였습니다. Excel 생성은 SXSSF 스트리밍으로 바꿔 메모리 사용량을 1.2GB에서 180MB로 줄였습니다.
        en: Used heap dumps, GC logs, and thread dumps to trace the cause to persistence context accumulation, then moved the batch to chunked transactions, cutting peak memory from 3.8 GB to 1.6 GB. Switched Excel generation to SXSSF streaming, reducing memory from 1.2 GB to 180 MB.
      metrics:
        - label: { ko-KR: 배치 메모리 피크, en: Batch peak memory }
          from: 3.8GB
          to: 1.6GB
        - label: { ko-KR: Excel 생성 메모리, en: Excel generation memory }
          from: 1.2GB
          to: 180MB
      tech: [Java, Spring Batch, JPA, MySQL, Apache POI (SXSSF)]
      posts:
        - /posts/batch-heap-dump-to-chunk/

personal:
  note:
    ko-KR: 주식 관찰 앱, 개발자 Q&A, 백엔드 실습 서비스, 결제 시스템을 만들었습니다. 모두 1인 개발이고 코드와 테스트는 GitHub에 공개되어 있습니다.
    en: A stock monitoring app, a developer Q&A, a backend practice service, and a payment system. All solo projects; code and tests are public on GitHub.
  items:
    - id: monticker
      title:
        ko-KR: Monticker — 이벤트 중심 주식 관찰 앱
        en: Monticker — event-centric stock monitoring
      period: 2026.1 –
      summary:
        ko-KR: 관심 종목의 가격과 거래량 변화를 시간순으로 모아 보는 앱입니다. 종목마다 거래 규모가 달라 지수이동평균(EMA) 대비 배율로 급증을 판단하고, 같은 변화가 1분 안에 반복되면 한 번만 기록하도록 저장 전 검사와 DB 제약을 함께 뒀습니다. 지금은 직접 생성한 데이터로 동작을 확인한 단계입니다.
        en: Collects price and volume changes for watched stocks into a timeline. Because volume scale differs per stock, surges are judged as multiples of an exponential moving average, and repeats of the same change within a minute are stored once through a pre-save check plus a database constraint. Verified so far on generated data.
      tech: [Kotlin, Spring Boot, PostgreSQL, Redis, Next.js]
      repo: https://github.com/polynomeer/monticker
      series: monticker

    - id: quno
      title:
        ko-KR: Quno — 변경 이력을 남기는 개발자 Q&A
        en: Quno — developer Q&A with revision history
      period: 2026.8 –
      summary:
        ko-KR: 질문을 계속 수정할 수 있고 이전 내용과 버전별 차이를 보존하는 Q&A입니다. 동시에 수정해도 버전 번호가 겹치지 않도록 질문 행을 잠그고(SELECT FOR UPDATE) 다음 버전을 계산하며, 질문 변경과 알림 요청을 한 트랜잭션에 묶었습니다. 8개 요청을 동시에 실행하는 통합 테스트로 누락과 중복이 없음을 확인했습니다.
        en: A Q&A where questions keep being revised while earlier content and per-version diffs are preserved. Concurrent edits lock the question row (SELECT FOR UPDATE) before computing the next version, and the change and its notification request commit in one transaction. An 8-thread integration test confirms no missing or duplicate versions.
      tech: [Kotlin, Spring Boot, PostgreSQL, MongoDB, Redis, React]
      repo: https://github.com/polynomeer/quno

    - id: sys-drill
      title:
        ko-KR: SysDrill — 백엔드 장애 대응 훈련 플랫폼
        en: SysDrill — backend failure-handling practice platform
      period: 2026.8 –
      summary:
        ko-KR: 요청 폭주나 작업 실패 같은 상황을 다루는 실습 6개를 풀고, 코드는 단계별 테스트로, 설계 설명은 AI 평가로 피드백을 받는 학습 서비스입니다. AI 응답은 정해진 항목과 점수 범위만 읽어 서버가 총점을 다시 계산하고, 평가는 Redis 대기열에서 별도 작업이 처리하며 반복 실패는 재시도 상한 뒤 실패 상태로 남깁니다.
        en: A practice service with six exercises on request bursts and failing jobs; code is graded by staged tests and design answers by an AI evaluator. The server reads only fixed fields and score ranges from the AI response and recomputes the total, evaluation runs from a Redis queue in a separate worker, and repeated failures stop after a retry limit and are recorded as failed.
      tech: [Kotlin, Spring Boot, Python, Redis, PostgreSQL, Next.js]
      repo: https://github.com/polynomeer/sys-drill

    - id: parity-pay
      title:
        ko-KR: ParityPay — 결제·원장 백엔드
        en: ParityPay — payment and ledger backend
      period: 2026.9 –
      summary:
        ko-KR: 선불 지갑의 결제 내역과 원장을 함께 관리하는 백엔드입니다. 같은 결제가 두 번 들어오거나 은행 응답이 끊겨도 중복 차감되지 않도록, 응답 유실은 실패로 단정하지 않고 미확정 상태로 보관한 뒤 별도 조회로 확정합니다. 잔액 차감 순서를 바꿔 같은 지갑의 잠금 시간을 줄였고, 프로세스 종료와 응답 유실 등 11개 장애 상황을 테스트 서버로 재현해 잔액과 원장이 맞는지 확인했습니다.
        en: Manages a prepaid wallet's payments together with a double-entry ledger. Duplicate requests and lost bank responses never debit twice; a lost response is kept as an undetermined state and settled by a separate status query rather than treated as failure. Moving the balance debit to the end of the transaction shortened lock hold on the same wallet, and 11 failure scenarios such as process kills and lost responses were reproduced against mock institutions to verify balances and ledger.
      tech: [Java, Spring Boot, PostgreSQL, Kafka, Testcontainers, ArchUnit]
      repo: https://github.com/polynomeer/parity-pay
      series: parity-pay
