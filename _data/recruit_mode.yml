  - title:
      ko-KR: Spring 백엔드
      en: Spring Backend
    description:
      ko-KR: 라이프사이클, 애너테이션, 트랜잭션 경계, 백엔드 애플리케이션 구조를 다룹니다.
      en: Lifecycle, annotations, transactional boundaries, and backend application structure.
