# /start/ 의 데이터. 처음 온 사람이 가진 시간만큼만 읽고 나갈 수 있게 하는 것이 목적이다.
# 각 항목은 실제로 공개된 글을 slug로 가리키고, 숨겨진 글은 렌더에서 빠진다.
# `why`는 그 글을 왜 이 자리에 두었는지이지 글의 요약이 아니다.
enabled: true
intro:
  ko-KR: 글이 천 편을 넘어 어디서 시작할지 고르기 어렵습니다. 가진 시간만큼만 읽고 나갈 수 있도록 세 가지 길을 준비했습니다.
  en: There are over a thousand posts here, which makes the first one hard to pick. These three paths are sized to the time you have.
tiers:
  - id: three-min
    label: { ko-KR: 3분, en: 3 minutes }
    goal: { ko-KR: 이 블로그가 무엇을 하는 곳인지 한 편으로 보기, en: One post that shows what this blog does }
    items:
      - slug: tomcat-thread-exhaustion
        why:
          ko-KR: 업스트림 하나가 느려지면 그것을 호출하지도 않는 엔드포인트가 먼저 죽는다는 것을 thread dump 세 장으로 보인 글입니다. 재현하고, 재고, 고치고, 같은 조건에서 다시 재는 이 블로그의 기본형입니다.
          en: Three thread dumps showing that a single slow upstream kills an endpoint that never touches it. Reproduce, measure, fix, measure again - the shape most posts here take.

  - id: fifteen-min
    label: { ko-KR: 15분, en: 15 minutes }
    goal: { ko-KR: 추론을 측정으로 바꾸는 세 가지 방식 보기, en: Three ways of turning inference into measurement }
    items:
      - slug: parity-pay-lock-hold-time
        why:
          ko-KR: "같은 지갑 경합의 원인을 추론이 아니라 측정으로 좁혔습니다. 잠금 보유 17ms 중 DB가 실제로 일한 시간은 2.31ms였고, 나머지는 애플리케이션을 기다린 시간이었습니다."
          en: "Narrowed a contention diagnosis by measurement instead of inference: of 17 ms of lock hold, 2.31 ms was database work."
      - slug: isolation-anomalies-experiment
        why:
          ko-KR: 같은 이름의 격리 수준에서 PostgreSQL은 중단시키고 MySQL은 조용히 덮어씁니다. 문서로는 같아 보이는 것이 20회 반복 측정에서 갈립니다.
          en: At the same isolation level PostgreSQL aborts and MySQL silently overwrites. What reads the same in the documentation splits in twenty repeats.
      - slug: parity-pay-experiments-and-defects
        why:
          ko-KR: 실험 27종이 찾은 결함 12건 중 6건은 설계 문서에 "대비되어 있다"고 적혀 있던 것이었습니다. 문서와 코드를 읽어서 나온 것은 하나도 없었습니다.
          en: Of 12 defects found by 27 experiments, 6 were written up in the design as already handled. None came from reading documents or code.

  - id: one-hour
    label: { ko-KR: 한 시간, en: An hour }
    goal: { ko-KR: 하나의 시스템을 처음부터 끝까지 따라가기, en: Follow one system from beginning to end }
    items:
      - series: parity-pay
        why:
          ko-KR: 결제·원장 백엔드를 만들며 불변조건을 문장으로 쓰고, 중복 요청·동시 차감·응답 유실·프로세스 재시작 아래에서 그것이 지켜지는지 실험으로 확인한 기록입니다. 열 편이 순서대로 이어집니다.
          en: Building a payments and ledger backend by writing the invariants down first, then testing whether they hold under duplicate requests, concurrent debits, lost responses and restarts. Ten posts in order.
next:
  - key: topics
    url: /topics/
    why:
      ko-KR: 찾는 주제가 분명하다면 질문으로 묶인 허브에서 시작하는 편이 빠릅니다.
      en: If you already know the subject, the question-shaped hubs are the faster entry.
  - key: experiments
    url: /experiments/
    why:
      ko-KR: 수치와 재현 방법만 보고 싶다면 실측 글만 모아 둔 곳이 있습니다.
      en: If you only want numbers and reproduction steps, the measured experiments are collected separately.
  - key: tech-reviews
    url: /tech-reviews/
    why:
      ko-KR: 다른 회사가 같은 문제를 어떻게 풀었는지가 궁금하다면 원문과 리뷰의 대응표가 있습니다.
      en: If you want to see how other companies solved the same problems, the source-to-review map is there.
