intro:
  ko-KR: 국내외 기술 컨퍼런스의 행사 페이지 링크와, 이 블로그에서 그 발표를 보고 쓴 리뷰의 대응표입니다. 회사 항목에서도 같은 발표가 세어지지만, 여기서는 행사 단위로 묶어 봅니다. 리뷰는 발표 영상과 자막을 근거로 내용을 옮기고, 내 실측과 실무 경험에 맞대어 보는 방식으로 씁니다.
  en: Links to the event pages of Korean and global engineering conferences mapped to the talk reviews written here. The same talks are counted under their companies above; this section groups them by event. Each review restates the talk from the video and captions, then compares it against my own measurements and production experience.
