# 기술 컨퍼런스 목록과 발표 리뷰 대응표의 데이터. /tech-reviews/ 페이지에서 쓴다.
# 발표 리뷰는 categories: [Conference, <회사>]에 컨퍼런스 이름이 없으므로 `tag`로 매칭한다: tags에 <tag>가 있는 Conference 글.
enabled: true
original:
  ko-KR: 행사 페이지
  en: Event page
summary_items:
  ko-KR: 컨퍼런스
  en: Conferences
summary_covered:
  ko-KR: 리뷰한 컨퍼런스
